name: Tests

# Pull requests only: pushes to main are tested by the Pages deploy workflow
on:
  pull_request:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Test exactly what GitHub Pages would publish, so a file missing from
      # scripts/build-site.sh fails here instead of breaking the live site
      - run: npm run build
      - run: npx playwright test
        env:
          SITE_DIR: _site
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
