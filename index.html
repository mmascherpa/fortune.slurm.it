<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Cookie</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#cookieContainer" class="sr-only focusable">Skip to fortune cookie</a>

    <!-- History Toggle Button -->
    <!-- Accessible name comes from its text: "History 3 fortunes" -->
    <button class="history-toggle"
            id="historyToggle"
            type="button"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="historyPanel">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        <span class="history-toggle-label">History</span>
        <span class="history-count"><span id="historyCount">0</span><span class="sr-only"> fortunes</span></span>
    </button>

    <!-- History Panel: a modal <dialog>, so the page behind it is inert while it is open -->
    <dialog class="history-panel"
            id="historyPanel"
            aria-labelledby="historyTitle">
        <div class="history-header">
            <div class="history-header-top">
                <div>
                    <h2 class="history-title" id="historyTitle">Fortune history</h2>
                    <p class="fortune-counter" id="fortuneCounter">0 cookies cracked so far</p>
                </div>
                <button class="history-close"
                        id="historyClose"
                        type="button"
                        aria-label="Close fortune history"
                        title="Close fortune history">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div class="history-search-container">
                <input type="search"
                       id="historySearch"
                       class="history-search-input"
                       placeholder="Search fortunes..."
                       aria-label="Search fortunes"
                       aria-controls="historyList">
            </div>
            <div class="history-filter">
                <button class="filter-toggle"
                        id="filterToggle"
                        type="button"
                        aria-pressed="false">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Favourites only
                </button>
            </div>
        </div>
        <div class="history-body">
            <ul class="history-list" id="historyList" aria-labelledby="historyTitle"></ul>
            <p class="history-empty" id="historyEmpty">No fortunes yet. Crack a cookie to begin!</p>
        </div>
        <!-- Confirmations while the drawer is open (the page-level one is inert behind it) -->
        <div class="toast" id="historyToast" role="status"></div>
    </dialog>

    <main role="main">
        <div class="container">
            <h1 class="title">Digital Fortune Cookie</h1>

            <div class="cookie-stage" id="cookieStage">
                <button class="cookie-container"
                        id="cookieContainer"
                        type="button"
                        aria-label="Crack the fortune cookie">
                    <span class="cookie" id="cookie" aria-hidden="true"></span>
                </button>

                <!-- inert while the cookie is closed: invisible content must not be focusable or announced -->
                <section class="fortune-slip"
                         id="fortuneSlip"
                         aria-label="Your fortune"
                         inert>
                    <button class="fortune-slip-btn copy-btn"
                            id="copyBtn"
                            type="button"
                            aria-label="Copy fortune to clipboard"
                            title="Copy fortune to clipboard">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    </button>
                    <blockquote>
                        <p class="fortune-text" id="fortuneText"></p>
                        <div class="lucky-numbers">
                            <p class="lucky-numbers-label">Lucky Numbers:</p>
                            <p class="lucky-numbers-text" id="luckyNumbers"></p>
                        </div>
                    </blockquote>
                    <div class="fortune-slip-actions">
                        <button class="save-favourite-btn"
                                id="saveFavouriteBtn"
                                type="button"
                                aria-pressed="false">
                            <span class="save-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
                            Save favourite
                        </button>
                    </div>
                </section>
            </div>

            <!-- One slot under the cookie: the hint before cracking, the next action after -->
            <div class="next-step">
                <p class="cookie-hint" id="cookieHint">
                    <span class="hint-touch">Tap the cookie to reveal your fortune</span>
                    <span class="hint-mouse">Click the cookie to reveal your fortune</span>
                </p>
                <button class="crack-another-btn" id="crackAnotherBtn" type="button" hidden>
                    Crack another cookie
                </button>
            </div>

            <!-- Announces each new fortune to screen readers without stealing focus -->
            <p class="sr-only" id="fortuneAnnouncer" role="status"></p>

            <a href="https://api.adviceslip.com"
               target="_blank"
               rel="noopener noreferrer"
               class="api-credit"
               aria-label="Powered by AdviceSlip API. Opens in new window.">
                Powered by AdviceSlip API
            </a>
        </div>
    </main>

    <!-- Brief confirmations such as "Saved to favourites" -->
    <div class="toast" id="toast" role="status"></div>

    <script src="app.js"></script>
</body>
</html>
